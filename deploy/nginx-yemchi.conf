limit_req_zone $binary_remote_addr zone=yemchi_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=yemchi_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name api.yemchi-w-yji.tn;

    client_max_body_size 10m;
    limit_conn yemchi_conn 20;

    location ~ ^/api/(analytics/events|errors)$ {
        limit_req zone=yemchi_api burst=20 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        limit_req zone=yemchi_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
