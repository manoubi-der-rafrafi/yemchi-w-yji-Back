spring.application.name=transport
server.address=0.0.0.0
server.port=${PORT:8081}

# MongoDB
spring.data.mongodb.uri=${MONGODB_URL}
spring.data.mongodb.auto-index-creation=true

# Max upload sizes
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.security.trust-proxy-headers=${TRUST_PROXY_HEADERS:false}
app.auth.allowed-origins=${AUTH_ALLOWED_ORIGINS:https://www.yemchi-w-yji.tn,https://yemchi-w-yji-front.vercel.app,http://localhost:4200}

# Cloudinary
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

spring.jackson.serialization.write-dates-as-timestamps=false
logging.level.com.transport.transport=DEBUG

# JWT
app.jwt.secret=${APP_JWT_SECRET}

# Sessions: JWT court + refresh token opaque rotatif.
app.auth.access-token-seconds=${ACCESS_TOKEN_SECONDS:900}
app.auth.refresh-token-seconds=${REFRESH_TOKEN_SECONDS:2592000}
app.auth.refresh-family-seconds=${REFRESH_FAMILY_SECONDS:7776000}
app.auth.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:true}
app.auth.refresh-cookie-same-site=${REFRESH_COOKIE_SAME_SITE:Lax}

spring.main.allow-bean-definition-overriding=true
app.google.client-id=620492568173-kp008ht9vks13j4gibpif4p5597tv14g.apps.googleusercontent.com
app.internal.provisioning-secret=${INTERNAL_PROVISIONING_SECRET}

# Email provider
resend.api.key=${RESEND_API_KEY}
# En prod, definir RESEND_FROM avec une adresse de votre domaine verifie.
resend.from=${RESEND_FROM:support@yemchi-w-yji.tn}
resend.provider=resend

app.verification.base-url=https://yemchi-w-yji-front.vercel.app/verify-email
ors.api.key=${ORS_API_KEY:}
app.vehicle-analysis.url=${VEHICLE_ANALYSIS_URL:}
app.vehicle-analysis.timeout-ms=${VEHICLE_ANALYSIS_TIMEOUT_MS:8000}
app.vehicle-analysis.alert-email=${VEHICLE_ANALYSIS_ALERT_EMAIL:manoubi.rafrafi109@gmail.com}

# n8n is called only by the backend. Configure Header Auth in n8n with the
# X-Webhook-Secret header and rotate the old public webhook URLs.
app.n8n.image-analysis-url=${N8N_IMAGE_ANALYSIS_URL:}
app.n8n.order-analysis-url=${N8N_ORDER_ANALYSIS_URL:}
app.n8n.webhook-secret=${N8N_WEBHOOK_SECRET:}
app.n8n.timeout-ms=${N8N_TIMEOUT_MS:10000}
app.n8n.allowed-image-hosts=${N8N_ALLOWED_IMAGE_HOSTS:res.cloudinary.com}
app.n8n.allowed-http-hosts=${N8N_ALLOWED_HTTP_HOSTS:localhost,127.0.0.1,workflow}
app.n8n.image-limit-per-minute=${N8N_IMAGE_LIMIT_PER_MINUTE:10}
app.n8n.order-limit-per-minute=${N8N_ORDER_LIMIT_PER_MINUTE:20}

# Synchronisation des statuts des commandes B2C vers la plateforme e-commerce.
app.ecommerce.status-webhook-url=${ECOMMERCE_STATUS_WEBHOOK_URL:}
app.ecommerce.status-webhook-secret=${ECOMMERCE_STATUS_WEBHOOK_SECRET:}
app.ecommerce.status-sync-retry-ms=${ECOMMERCE_STATUS_SYNC_RETRY_MS:5000}
